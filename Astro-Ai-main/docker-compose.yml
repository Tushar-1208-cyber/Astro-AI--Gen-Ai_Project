services:
  # 1. Astro AI - Persistent MongoDB Database with Authenticated Access
  mongodb:
    image: mongo:7.0
    container_name: astro-mongodb
    restart: unless-stopped
    # Restrict port exposure strictly to localhost on host; remove or omit in strict container-only networks
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME environment variable is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD environment variable is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-astro}
    volumes:
      - mongo_data:/data/db
    networks:
      - astro-network
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "-u"
        - "${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}"
        - "-p"
        - "${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Astro AI - Local Fine-Tuned AI Inference Engine (TinyLlama LoRA)
  local-ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: astro-ai-engine
    restart: unless-stopped
    # Restrict inference port strictly to localhost on host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:9002,http://app:9002}
    volumes:
      - ./my_finetuned_model:/app/my_finetuned_model:ro
    networks:
      - astro-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 3. Astro AI - Next.js Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astro-app
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=production
      - PORT=9002
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required and must not be empty}
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}:${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}@mongodb:27017/${MONGO_DATABASE:-astro}?authSource=admin}
      - LOCAL_AI_URL=http://local-ai:8000/generate
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      local-ai:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    networks:
      - astro-network

networks:
  astro-network:
    name: astro-internal-network
    driver: bridge

volumes:
  mongo_data:
    name: astro_mongo_data
  uploads_data:
    name: astro_uploads_data
  backups_data:
    name: astro_backups_data
